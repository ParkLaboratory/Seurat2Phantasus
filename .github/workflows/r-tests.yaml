name: R regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          extra-packages: any::rcmdcheck
          dependencies: '"hard"'
          cache: always
      - name: Install package
        run: R CMD INSTALL .
      - name: Run regression checks
        run: Rscript tests/regression.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'
          upload-results: always
